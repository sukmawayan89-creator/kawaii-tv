<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kawaii TV Virtual Remote</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-green: #3bef7e;
      --primary-green-glow: rgba(59, 239, 126, 0.4);
      --bg-dark-900: #020617;
      --bg-dark-800: #0f172a;
      --bg-dark-700: #1e293b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark-900);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      background-image: 
        radial-gradient(at 50% 0%, rgba(59, 239, 126, 0.12) 0px, transparent 60%);
    }

    /* HEADER */
    header {
      text-align: center;
      margin-top: 10px;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary-green);
      text-shadow: 0 0 10px var(--primary-green-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* REMOTE CONTAINER */
    .remote-body {
      width: 100%;
      max-width: 320px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 40px;
      padding: 30px 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin: auto 0;
    }

    /* ROW CONTROLS */
    .btn-row {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 15px;
    }

    .btn-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--bg-dark-700);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-circle:active {
      transform: scale(0.92);
      background: var(--primary-green);
      color: #020617;
      border-color: var(--primary-green);
      box-shadow: 0 0 15px var(--primary-green-glow);
    }

    .btn-power {
      border-color: #ef4444;
      color: #ef4444;
    }

    .btn-power:active {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    }

    /* DPAD SYSTEM */
    .dpad-container {
      position: relative;
      width: 200px;
      height: 200px;
      background: #090d16;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.8), 0 8px 24px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dpad-btn {
      position: absolute;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 55px;
      height: 55px;
      transition: all 0.12s ease;
    }

    .dpad-btn:active {
      color: var(--primary-green);
      text-shadow: 0 0 8px var(--primary-green);
    }

    .dpad-up { top: 6px; left: 72.5px; }
    .dpad-down { bottom: 6px; left: 72.5px; }
    .dpad-left { left: 6px; top: 72.5px; }
    .dpad-right { right: 6px; top: 72.5px; }

    .dpad-ok {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-dark-700);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 5;
      transition: all 0.15s ease;
    }

    .dpad-ok:active {
      transform: scale(0.92);
      background: var(--primary-green);
      color: #020617;
      border-color: var(--primary-green);
      box-shadow: 0 0 20px var(--primary-green-glow);
    }

    /* DOUBLE CONTROLS (VOLUME / CHANNEL) */
    .vertical-controls {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 30px;
      padding: 0 10px;
    }

    .rocker-switch {
      background: var(--bg-dark-700);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 60px;
      padding: 8px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .rocker-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      width: 44px;
      height: 44px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .rocker-btn:active {
      color: var(--primary-green);
      transform: scale(0.85);
    }

    .rocker-label {
      font-size: 0.65rem;
      font-weight: 900;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 4px 0;
      letter-spacing: 0.5px;
    }

    /* FOOTER */
    footer {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 5px;
    }

    footer span {
      color: var(--primary-green);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1><i class="fa-solid fa-gamepad"></i> KAWAII REMOTE</h1>
    <p>Android TV Virtual Controller</p>
  </header>

  <!-- REMOTE MODULE -->
  <div class="remote-body">
    
    <!-- Top Row (Power, Info) -->
    <div class="btn-row">
      <button class="btn-circle btn-power" onclick="sendCmd('power')"><i class="fa-solid fa-power-off"></i></button>
      <button class="btn-circle" onclick="sendCmd('mute')"><i class="fa-solid fa-volume-xmark"></i></button>
    </div>

    <!-- Directional Pad (D-PAD) -->
    <div class="dpad-container">
      <button class="dpad-btn dpad-up" onclick="sendCmd('up')"><i class="fa-solid fa-caret-up"></i></button>
      <button class="dpad-btn dpad-left" onclick="sendCmd('left')"><i class="fa-solid fa-caret-left"></i></button>
      <button class="dpad-ok" onclick="sendCmd('ok')">OK</button>
      <button class="dpad-btn dpad-right" onclick="sendCmd('right')"><i class="fa-solid fa-caret-right"></i></button>
      <button class="dpad-btn dpad-down" onclick="sendCmd('down')"><i class="fa-solid fa-caret-down"></i></button>
    </div>

    <!-- Navigation Row -->
    <div class="btn-row">
      <button class="btn-circle" onclick="sendCmd('back')"><i class="fa-solid fa-arrow-rotate-left"></i></button>
      <button class="btn-circle" onclick="sendCmd('home')"><i class="fa-solid fa-house"></i></button>
    </div>

    <!-- Volume & Channel Rockers -->
    <div class="vertical-controls">
      <!-- Volume Rocker -->
      <div class="rocker-switch">
        <button class="rocker-btn" onclick="sendCmd('volup')"><i class="fa-solid fa-plus"></i></button>
        <span class="rocker-label">VOL</span>
        <button class="rocker-btn" onclick="sendCmd('voldown')"><i class="fa-solid fa-minus"></i></button>
      </div>

      <!-- Channel Rocker -->
      <div class="rocker-switch">
        <button class="rocker-btn" onclick="sendCmd('chnext')"><i class="fa-solid fa-chevron-up"></i></button>
        <span class="rocker-label">CH</span>
        <button class="rocker-btn" onclick="sendCmd('chprev')"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    Terhubung via <span>Local Wi-Fi Network</span>
  </footer>

  <script>
    // Determine the base backend API URL
    const isLocalFile = window.location.protocol === 'file:';
    const baseApi = isLocalFile ? 'http://localhost:8081' : window.location.origin;

    function sendCmd(cmd) {
      // Trigger haptic vibration feedback (if supported by phone)
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
      
      const targetUrl = `${baseApi}/remote-send?cmd=${cmd}`;
      console.log(`Sending command: ${cmd}`);
      
      fetch(targetUrl)
        .then(res => {
          if (!res.ok) console.warn("Failed to send command to server");
        })
        .catch(err => console.error("Remote send connection error:", err));
    }
  </script>
</body>
</html>
